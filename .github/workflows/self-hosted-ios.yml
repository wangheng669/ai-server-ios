name: Build on Mac mini and install on iPhone

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build and install
        required: false
        type: string
run-name: Install ${{ inputs.git_ref || github.ref_name }}

concurrency:
  # Manual fallback deployments share one latest-wins queue.
  # A newer request cancels any older build or install before deploying.
  group: ios-device-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on office Mac mini
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - office-builder
    timeout-minutes: 30

    steps:
      - name: Check out latest commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Report build started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.08 testing

      - name: Run tests
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
        run: |
          set -o pipefail
          ./ci/with-ios-simulator-lock.sh \
            --label "manual install tests $GITHUB_RUN_ID" \
            -- xcodebuild test \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-TestData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Report tests completed
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.35 building

      - name: Build unsigned device app
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-DeviceData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          app_path="$RUNNER_TEMP/AIServerClient-DeviceData/Build/Products/Debug-iphoneos/AIServerClient.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/AIServerClient.app.zip"

      - name: Report signing started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.82 signing

      - name: Sign and install directly on office Mac mini
        env:
          APP_ARCHIVE: ${{ runner.temp }}/AIServerClient.app.zip
          APP_PATH: ${{ runner.temp }}/signed-app/AIServerClient.app
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/sign-and-install-ios.sh

      - name: Report direct installation completed
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh succeeded 1 installed

      - name: Report build failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 build-failed
