name: Build on Mac mini and install on iPhone

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build and install
        required: false
        type: string
      install_target:
        description: Mac that can currently reach the iPhone
        required: false
        default: auto
        type: choice
        options:
          - auto
          - home
          - office

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Install {0}', inputs.git_ref || github.ref_name) || github.event.head_commit.message }}

concurrency:
  # All automatic and manual device deployments share one latest-wins queue.
  # A newer main push cancels any older build or install before deploying.
  group: ios-device-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on office Mac mini
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - office-builder
    timeout-minutes: 30

    steps:
      - name: Check out latest commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Report build started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.08 testing

      - name: Run tests
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
        run: |
          set -o pipefail
          xcodebuild test \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-TestData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Report tests completed
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.35 building

      - name: Build unsigned device app
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-DeviceData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          app_path="$RUNNER_TEMP/AIServerClient-DeviceData/Build/Products/Debug-iphoneos/AIServerClient.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/AIServerClient.app.zip"

      - name: Upload device app
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-app
          path: ${{ runner.temp }}/AIServerClient.app.zip
          if-no-files-found: error
          retention-days: 3

      - name: Report build completed
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.58 waiting-for-installer

      - name: Report build failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 build-failed

  install:
    name: Sign and install on selected iPhone host
    needs: build
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ (inputs.install_target == 'office' || (inputs.install_target != 'home' && vars.IOS_INSTALL_TARGET == 'office')) && 'office-builder' || 'home-installer' }}
    timeout-minutes: 10

    steps:
      - name: Check out installation script
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Report installer started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.68 downloading

      - name: Download device app
        uses: actions/download-artifact@v8
        with:
          name: ios-device-app
          path: ${{ runner.temp }}/ios-device-app

      - name: Report signing started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.82 signing

      - name: Extract, sign, and install
        env:
          APP_ARCHIVE: ${{ runner.temp }}/ios-device-app/AIServerClient.app.zip
          APP_PATH: ${{ runner.temp }}/signed-app/AIServerClient.app
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/sign-and-install-ios.sh

      - name: Report installation completed
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh succeeded 1 installed

      - name: Report installation failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 install-failed
