name: Build on Hackintosh

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build and install
        required: false
        type: string
      install_on_device:
        description: Sign and install on the connected iPhone
        required: true
        default: false
        type: boolean
run-name: Build ${{ inputs.git_ref || github.ref_name }}

concurrency:
  # Manual fallback deployments share one latest-wins queue.
  # A newer request cancels any older build or install before deploying.
  group: ios-device-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Hackintosh
    runs-on:
      - self-hosted
      - macOS
      - X64
      - ios-hackintosh
    timeout-minutes: 30
    steps:
      - name: Check out latest commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Report build started
        if: inputs.install_on_device
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: |
          workflow_started_epoch=$(date +%s)
          echo "IOS_WORKFLOW_STARTED_EPOCH=$workflow_started_epoch" >> "$GITHUB_ENV"
          echo "IOS_PREFLIGHT_SECONDS=0" >> "$GITHUB_ENV"
          echo "IOS_PREPARE_SECONDS=0" >> "$GITHUB_ENV"
          echo "IOS_DEVICE_WARM_SECONDS=0" >> "$GITHUB_ENV"
          IOS_WORKFLOW_STARTED_EPOCH="$workflow_started_epoch" ./ci/report-ios-deployment.sh running 0.08 testing

      - name: Run tests
        id: ios_tests
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
        run: |
          set -o pipefail
          mkdir -p "$IOS_BUILD_CACHE_ROOT"
          ./ci/run-timed-step.sh "Complete iOS tests" \
            ./ci/with-ios-simulator-lock.sh \
              --label "manual install tests $GITHUB_RUN_ID" \
              --wait-seconds 1200 \
              -- xcodebuild test \
              -project AIServerClient.xcodeproj \
              -scheme AIServerClient \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
              -collect-test-diagnostics never \
              -derivedDataPath "$IOS_BUILD_CACHE_ROOT/manual-install-simulator" \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO

      - name: Report tests completed
        if: inputs.install_on_device
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_MERGE_SECONDS: ${{ steps.ios_tests.outputs.duration_seconds }}
        run: |
          echo "IOS_MERGE_SECONDS=$IOS_MERGE_SECONDS" >> "$GITHUB_ENV"
          ./ci/report-ios-deployment.sh running 0.35 building

      - name: Build unsigned device app
        id: device_build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
        run: |
          set -o pipefail
          mkdir -p "$IOS_BUILD_CACHE_ROOT"
          ./ci/run-timed-step.sh "Unsigned device build" \
            xcodebuild build \
              -project AIServerClient.xcodeproj \
              -scheme AIServerClient \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$IOS_BUILD_CACHE_ROOT/manual-install-device" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO

          app_path="$IOS_BUILD_CACHE_ROOT/manual-install-device/Build/Products/Debug-iphoneos/AIServerClient.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/AIServerClient.app.zip"

      - name: Report signing started
        if: inputs.install_on_device
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: ${{ steps.device_build.outputs.duration_seconds }}
        run: |
          echo "IOS_BUILD_SECONDS=$IOS_BUILD_SECONDS" >> "$GITHUB_ENV"
          ./ci/report-ios-deployment.sh running 0.82 signing

      - name: Sign and install on iPhone
        if: inputs.install_on_device
        id: local_install
        env:
          APP_ARCHIVE: ${{ runner.temp }}/AIServerClient.app.zip
          APP_PATH: ${{ runner.temp }}/signed-app/AIServerClient.app
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_SIGNING_DERIVED_DATA_PATH: ${{ runner.tool_cache }}/ai-server-ios/manual-install-signing
        run: ./ci/run-timed-step.sh "Sign and install on iPhone" ./ci/sign-and-install-ios.sh

      - name: Report direct installation completed
        if: inputs.install_on_device
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_MERGE_SECONDS: ${{ steps.ios_tests.outputs.duration_seconds }}
          IOS_BUILD_SECONDS: ${{ steps.device_build.outputs.duration_seconds }}
          IOS_INSTALL_SECONDS: ${{ steps.local_install.outputs.duration_seconds }}
          IOS_DEVICE_WAIT_DURATION_SECONDS: ${{ steps.local_install.outputs.device_wait_seconds }}
          IOS_DIRECT_INSTALL_SECONDS: ${{ steps.local_install.outputs.direct_install_seconds }}
          IOS_XCODE_RECOVERY_SECONDS: ${{ steps.local_install.outputs.xcode_recovery_seconds }}
          IOS_FINAL_INSTALL_SECONDS: ${{ steps.local_install.outputs.final_install_seconds }}
        run: ./ci/report-ios-deployment.sh succeeded 1 installed

      - name: Report build failure
        if: failure() && inputs.install_on_device
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 build-failed
