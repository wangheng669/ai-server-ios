name: AI merge task branch into main

on:
  push:
    branches:
      - "codex/**"

run-name: Merge ${{ github.ref_name }} into latest main

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    name: Run preflight and warm caches in parallel
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.IOS_CENTRAL_RUNNER_LABEL || 'office-builder' }}
    timeout-minutes: 15
    outputs:
      duration_seconds: ${{ steps.central_prepare.outputs.duration_seconds }}
      preflight_duration_seconds: ${{ steps.central_prepare.outputs.preflight_duration_seconds }}
      started_epoch: ${{ steps.central_prepare.outputs.started_epoch }}
      device_warm_duration_seconds: ${{ steps.central_prepare.outputs.device_warm_duration_seconds }}
      dependency_duration_seconds: ${{ steps.central_prepare.outputs.dependency_duration_seconds }}
      device_build_warm_duration_seconds: ${{ steps.central_prepare.outputs.device_build_warm_duration_seconds }}
      simulator_warm_duration_seconds: ${{ steps.central_prepare.outputs.simulator_warm_duration_seconds }}
    steps:
      - name: Check out task commit for cache warming
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require a stable wired and unlocked iPhone
        env:
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          DEPLOYMENT_STATUS_BASE_URL: https://api.wanghengai.xin
          IOS_DEVICE_STABILITY_ATTEMPTS: 3
          IOS_DEVICE_STABILITY_INTERVAL_SECONDS: 5
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          if ! git cat-file -e origin/main:ci/verify-ios-device-stability.sh 2>/dev/null; then
            echo "Bootstrapping the device stability gate; it becomes mandatory after this commit reaches main."
            exit 0
          fi
          ./ci/report-ios-deployment.sh running 0.005 checking-device-stability || true
          if ! ./ci/probe-ios-device.sh; then
            ./ci/report-ios-deployment.sh failed 0 device-gate-failed || true
            exit 1
          fi
          ./ci/report-ios-deployment.sh running 0.01 device-gate-ready || true

      - name: Run preflight and warm device build cache
        id: central_prepare
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
        run: |
          ./ci/report-ios-deployment.sh running 0.01 central-preparing || true
          ./ci/prepare-central-runner-parallel.sh

  merge:
    name: Safely integrate on selected central Mac
    needs:
      - prepare
    concurrency:
      group: ai-merge-to-main
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.IOS_CENTRAL_RUNNER_LABEL || 'office-builder' }}
    timeout-minutes: 45
    env:
      IOS_PREFLIGHT_SECONDS: ${{ needs.prepare.outputs.preflight_duration_seconds }}
      IOS_PREPARE_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
      IOS_DEVICE_WARM_SECONDS: ${{ needs.prepare.outputs.device_warm_duration_seconds }}
      IOS_WORKFLOW_STARTED_EPOCH: ${{ needs.prepare.outputs.started_epoch }}
    steps:
      - name: Check out task commit with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN }}

      - name: Report merge started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: |
          echo "IOS_MERGE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          ./ci/report-ios-deployment.sh running 0.02 merging

      - name: Merge task into latest main
        id: merge
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "AI Merge Bot"
          git config user.email "actions@users.noreply.github.com"
          git config http.version HTTP/1.1
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags origin main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to fetch main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          ./ci/classify-ios-test-scope.sh \
            < <(git diff --name-only origin/main..."$SOURCE_SHA") \
            >> "$GITHUB_OUTPUT"

          git switch --force-create ai-merge origin/main

          if git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

          if git merge --no-ff --no-commit "$SOURCE_SHA"; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            test -n "$(git diff --name-only --diff-filter=U)"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve merge conflicts with local Codex
        if: steps.merge.outputs.has_conflicts == 'true' && steps.merge.outputs.already_merged == 'false'
        env:
          HOME: /Users/wangheng
        run: |
          set -euo pipefail
          codex_bin="$(command -v codex 2>/dev/null || true)"
          if [[ -z "$codex_bin" && -x /opt/homebrew/bin/codex ]]; then
            codex_bin=/opt/homebrew/bin/codex
          fi
          if [[ -z "$codex_bin" ]]; then
            codex_bin="$(find "$HOME/.nvm/versions/node" -path '*/bin/codex' -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$codex_bin" || ! -x "$codex_bin" ]]; then
            echo "Local Codex CLI is not installed for $USER." >&2
            exit 1
          fi
          auth_file="$HOME/.codex/auth.json"
          if [[ ! -f "$auth_file" ]]; then
            echo "Local Codex login was not found for $USER." >&2
            exit 1
          fi
          automation_home="$RUNNER_TEMP/codex-ai-merge-home"
          install -d -m 700 "$automation_home"
          install -m 600 "$auth_file" "$automation_home/auth.json"
          CODEX_HOME="$automation_home" "$codex_bin" login status

          CODEX_HOME="$automation_home" "$codex_bin" exec \
            --ephemeral \
            --ignore-user-config \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="high"' \
            --sandbox workspace-write \
            --cd "$GITHUB_WORKSPACE" \
            - <<'PROMPT'
            Resolve the Git merge conflicts currently present in this repository.

            Goal: preserve the intended behavior from both the latest origin/main
            and the task branch being merged.

            Requirements:
            - Read AGENTS.md and follow its safety and verification rules.
            - Inspect both sides and their commit history before deciding.
            - Resolve every conflict semantically; never choose ours/theirs wholesale.
            - Keep unrelated code unchanged and do not delete either feature merely to compile.
            - Do not commit, push, install, change GitHub settings, or access secrets.
            - Leave the working tree with no unmerged paths.
            - If the two intentions are genuinely incompatible, leave that conflict unresolved
              and explain why instead of guessing. The workflow will stop safely.
          PROMPT

      - name: Verify conflict resolution and create merge commit
        if: steps.merge.outputs.already_merged == 'false'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unmerged" ]]; then
            echo "AI could not safely resolve these files:" >&2
            echo "$unmerged" >&2
            exit 1
          fi
          git add -A
          git commit -m "Merge $SOURCE_BRANCH into main"

      - name: Run change-aware iOS tests
        id: ios_tests
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
        run: |
          test_scope='${{ steps.merge.outputs.test_scope }}'
          test_label="Complete iOS tests"
          test_stage=full-testing
          test_arguments=()
          if [[ "$test_scope" == feed ]]; then
            test_label="Feed-focused iOS tests"
            test_stage=targeted-testing
            test_arguments=(-only-testing:AIClientTests/FeedAdapterTests)
          fi
          ./ci/report-ios-deployment.sh running 0.04 "$test_stage" || true
          set -o pipefail
          mkdir -p "$IOS_BUILD_CACHE_ROOT"
          ./ci/run-timed-step.sh "$test_label" \
            ./ci/with-ios-simulator-lock.sh \
              --label "central merge tests $GITHUB_RUN_ID" \
              -- xcodebuild test \
              -project AIServerClient.xcodeproj \
              -scheme AIServerClient \
              -destination 'platform=iOS Simulator,name=iPhone 16e' \
              -collect-test-diagnostics never \
              -derivedDataPath "$IOS_BUILD_CACHE_ROOT/central-merge-simulator" \
              -clonedSourcePackagesDirPath "$IOS_BUILD_CACHE_ROOT/source-packages" \
              "${test_arguments[@]}" \
              CODE_SIGNING_ALLOWED=NO

      - name: Report merge verification completed
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.06 publishing

      - name: Publish merged main
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          set -euo pipefail
          git config http.version HTTP/1.1
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags origin main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to verify main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Record merge and verification duration
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          now_epoch=$(date +%s)
          echo "IOS_MERGE_SECONDS=$((now_epoch - IOS_MERGE_STARTED_EPOCH))" >> "$GITHUB_ENV"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^1)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to publish main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Delete merged task branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$SOURCE_BRANCH"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git push \
            --force-with-lease="refs/heads/$SOURCE_BRANCH:$SOURCE_SHA" \
            origin ":refs/heads/$SOURCE_BRANCH"

      - name: Build signed app for local iPhone installation
        id: device_build
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          ./ci/report-ios-deployment.sh running 0.72 building-device-app || true
          mkdir -p "$IOS_BUILD_CACHE_ROOT"
          ./ci/run-timed-step.sh "Signed device build" \
            xcodebuild build \
              -project AIServerClient.xcodeproj \
              -scheme AIServerClient \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$IOS_BUILD_CACHE_ROOT/central-merge-signing" \
              -clonedSourcePackagesDirPath "$IOS_BUILD_CACHE_ROOT/source-packages" \
              -allowProvisioningUpdates \
              -allowProvisioningDeviceRegistration \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic

          app_path="$IOS_BUILD_CACHE_ROOT/central-merge-signing/Build/Products/Debug-iphoneos/AIServerClient.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/AIServerClient.app.zip"

      - name: Install directly from selected central Mac
        id: local_install
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        continue-on-error: true
        env:
          APP_ARCHIVE: ${{ runner.temp }}/AIServerClient.app.zip
          APP_PATH: ${{ runner.temp }}/signed-app/AIServerClient.app
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_SIGNING_DERIVED_DATA_PATH: ${{ runner.tool_cache }}/ai-server-ios/central-merge-signing
        run: ./ci/run-timed-step.sh "Sign and install on iPhone" ./ci/sign-and-install-ios.sh

      - name: Report local installation completed
        if: always() && steps.local_install.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: ${{ steps.device_build.outputs.duration_seconds }}
          IOS_INSTALL_SECONDS: ${{ steps.local_install.outputs.duration_seconds }}
          IOS_DEVICE_WAIT_DURATION_SECONDS: ${{ steps.local_install.outputs.device_wait_seconds }}
          IOS_DIRECT_INSTALL_SECONDS: ${{ steps.local_install.outputs.direct_install_seconds }}
          IOS_XCODE_RECOVERY_SECONDS: ${{ steps.local_install.outputs.xcode_recovery_seconds }}
          IOS_FINAL_INSTALL_SECONDS: ${{ steps.local_install.outputs.final_install_seconds }}
        run: ./ci/report-ios-deployment.sh succeeded 1 installed-locally

      - name: Report configuration-only delivery completed
        if: always() && steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'false' && !failure()
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: 0
          IOS_INSTALL_SECONDS: 0
        run: ./ci/report-ios-deployment.sh succeeded 1 published-no-app-change

      - name: Schedule a fresh installation retry on office Mac mini
        if: always() && steps.local_install.outcome == 'failure' && (vars.IOS_CENTRAL_RUNNER_LABEL || 'office-builder') == 'office-builder'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 \
            --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/self-hosted-ios.yml/dispatches" \
            --data '{"ref":"main","inputs":{"git_ref":"main"}}'

      - name: Report local installation failed
        if: always() && steps.local_install.outcome == 'failure'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: ${{ steps.device_build.outputs.duration_seconds }}
          IOS_INSTALL_SECONDS: ${{ steps.local_install.outputs.duration_seconds }}
          IOS_DEVICE_WAIT_DURATION_SECONDS: ${{ steps.local_install.outputs.device_wait_seconds }}
          IOS_DIRECT_INSTALL_SECONDS: ${{ steps.local_install.outputs.direct_install_seconds }}
          IOS_XCODE_RECOVERY_SECONDS: ${{ steps.local_install.outputs.xcode_recovery_seconds }}
          IOS_FINAL_INSTALL_SECONDS: ${{ steps.local_install.outputs.final_install_seconds }}
        run: ./ci/report-ios-deployment.sh failed 1 installation-failed

      - name: Fail delivery when local installation failed
        if: always() && steps.local_install.outcome == 'failure'
        run: |
          echo "The app was merged and built, but installation on the configured iPhone failed." >&2
          exit 1

      - name: Report merge failure
        if: ${{ failure() && steps.local_install.outcome != 'failure' }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 merge-failed
