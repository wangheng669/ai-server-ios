name: AI merge task branch into main

on:
  push:
    branches:
      - "codex/**"

run-name: Merge ${{ github.ref_name }} into latest main

permissions:
  actions: write
  contents: write

jobs:
  merge:
    name: Prepare, integrate, test, and install on selected central Mac
    concurrency:
      group: ai-merge-to-main
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.IOS_CENTRAL_RUNNER_LABEL || 'office-builder' }}
    timeout-minutes: 60
    steps:
      - name: Reuse local repository and check out task commit
        env:
          CHECKOUT_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/ai-server-ios-git-token"
          askpass_file="$RUNNER_TEMP/ai-server-ios-git-askpass.sh"
          umask 077
          printf '%s' "$CHECKOUT_TOKEN" > "$token_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat "${RUNNER_TEMP:?}/ai-server-ios-git-token" ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_TERMINAL_PROMPT=0
          {
            echo "GIT_ASKPASS=$askpass_file"
            echo "GIT_TERMINAL_PROMPT=0"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx
          git fetch --no-tags --prune --depth=64 origin "$GITHUB_SHA"
          git checkout --detach --force "$GITHUB_SHA"

      - name: Run preflight and warm device build cache
        id: central_prepare
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DEVICE_STABILITY_ATTEMPTS: 3
          IOS_DEVICE_STABILITY_INTERVAL_SECONDS: 5
          IOS_REQUIRE_DEVICE_GATE: ${{ vars.IOS_REQUIRE_DEVICE_GATE || 'false' }}
        run: |
          ./ci/git-fetch-origin.sh \
            --no-tags \
            --depth=64 \
            origin \
            main:refs/remotes/origin/main
          ./ci/report-ios-deployment.sh running 0.01 central-preparing || true
          ./ci/prepare-central-runner-parallel.sh

      - name: Report merge started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: |
          echo "IOS_MERGE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          ./ci/report-ios-deployment.sh running 0.02 merging

      - name: Merge task into latest main
        id: merge
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "AI Merge Bot"
          git config user.email "actions@users.noreply.github.com"
          git config http.version HTTP/1.1
          ./ci/git-fetch-origin.sh \
            --no-tags \
            --depth=64 \
            origin \
            main:refs/remotes/origin/main
          for deepen_by in 128 256 512; do
            if git merge-base "$SOURCE_SHA" origin/main >/dev/null 2>&1; then
              break
            fi
            echo "Merge base is outside the shallow history; deepening by $deepen_by commits."
            ./ci/git-fetch-origin.sh \
              --no-tags \
              --deepen="$deepen_by" \
              origin \
              main \
              "$SOURCE_BRANCH"
          done
          if ! git merge-base "$SOURCE_SHA" origin/main >/dev/null 2>&1; then
            echo "Merge base is still unavailable; falling back to the complete history."
            ./ci/git-fetch-origin.sh \
              --no-tags \
              --unshallow \
              origin \
              main \
              "$SOURCE_BRANCH"
          fi
          low_risk_change=false
          if ./ci/is-low-risk-ios-diff.sh origin/main "$SOURCE_SHA"; then
            low_risk_change=true
          fi
          IOS_LOW_RISK_CHANGE="$low_risk_change" ./ci/classify-ios-test-scope.sh \
            < <(git diff --name-only origin/main..."$SOURCE_SHA") \
            >> "$GITHUB_OUTPUT"

          git switch --force-create ai-merge origin/main

          if git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

          if git merge --no-ff --no-commit "$SOURCE_SHA"; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            test -n "$(git diff --name-only --diff-filter=U)"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve merge conflicts with local Codex
        if: steps.merge.outputs.has_conflicts == 'true' && steps.merge.outputs.already_merged == 'false'
        env:
          HOME: /Users/wangheng
        run: |
          set -euo pipefail
          codex_bin="$(command -v codex 2>/dev/null || true)"
          if [[ -z "$codex_bin" && -x /opt/homebrew/bin/codex ]]; then
            codex_bin=/opt/homebrew/bin/codex
          fi
          if [[ -z "$codex_bin" ]]; then
            codex_bin="$(find "$HOME/.nvm/versions/node" -path '*/bin/codex' -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$codex_bin" || ! -x "$codex_bin" ]]; then
            echo "Local Codex CLI is not installed for $USER." >&2
            exit 1
          fi
          auth_file="$HOME/.codex/auth.json"
          if [[ ! -f "$auth_file" ]]; then
            echo "Local Codex login was not found for $USER." >&2
            exit 1
          fi
          automation_home="$RUNNER_TEMP/codex-ai-merge-home"
          install -d -m 700 "$automation_home"
          install -m 600 "$auth_file" "$automation_home/auth.json"
          CODEX_HOME="$automation_home" "$codex_bin" login status

          CODEX_HOME="$automation_home" "$codex_bin" exec \
            --ephemeral \
            --ignore-user-config \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="high"' \
            --sandbox workspace-write \
            --cd "$GITHUB_WORKSPACE" \
            - <<'PROMPT'
            Resolve the Git merge conflicts currently present in this repository.

            Goal: preserve the intended behavior from both the latest origin/main
            and the task branch being merged.

            Requirements:
            - Read AGENTS.md and follow its safety and verification rules.
            - Inspect both sides and their commit history before deciding.
            - Resolve every conflict semantically; never choose ours/theirs wholesale.
            - Keep unrelated code unchanged and do not delete either feature merely to compile.
            - Do not commit, push, install, change GitHub settings, or access secrets.
            - Leave the working tree with no unmerged paths.
            - If the two intentions are genuinely incompatible, leave that conflict unresolved
              and explain why instead of guessing. The workflow will stop safely.
          PROMPT

      - name: Verify conflict resolution and create merge commit
        if: steps.merge.outputs.already_merged == 'false'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unmerged" ]]; then
            echo "AI could not safely resolve these files:" >&2
            echo "$unmerged" >&2
            exit 1
          fi
          git add -A
          git commit -m "Merge $SOURCE_BRANCH into main"

      - name: Run change-aware iOS tests
        id: ios_tests
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_CACHE_ROOT: ${{ runner.tool_cache }}/ai-server-ios
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          test_scope='${{ steps.merge.outputs.test_scope }}'
          if [[ "$test_scope" == build ]] && ! ./ci/is-low-risk-ios-diff.sh HEAD^1 HEAD; then
            echo "Merged tree is no longer a pure cache-key version bump; restoring full simulator tests."
            test_scope=full
          fi
          test_label="Complete iOS tests"
          test_stage=full-testing
          test_arguments=()
          if [[ "$test_scope" == feed ]]; then
            test_label="Feed-focused iOS tests"
            test_stage=targeted-testing
            test_arguments=(-only-testing:AIClientTests/FeedAdapterTests)
          elif [[ "$test_scope" == build ]]; then
            test_label="Signed device build verification"
            test_stage=build-verification
          fi
          test_action='test'
          prewarmed_sha_file="$IOS_BUILD_CACHE_ROOT/central-merge-simulator/prewarmed-source-sha"
          if [[ -f "$prewarmed_sha_file" ]] \
            && [[ "$(cat "$prewarmed_sha_file")" == "${{ github.sha }}" ]] \
            && git diff --quiet "${{ github.sha }}" HEAD -- .; then
            test_action='test-without-building'
            test_label="$test_label (reuse prebuilt app)"
            echo "Reusing build-for-testing output for unchanged merged tree ${{ github.sha }}."
          else
            echo "Merged tree or cache identity changed; rebuilding before tests."
          fi
          ./ci/report-ios-deployment.sh running 0.04 "$test_stage" || true
          mkdir -p "$IOS_BUILD_CACHE_ROOT"

          build_log=$(mktemp "$RUNNER_TEMP/signed-device-build.XXXXXX")
          build_result=$(mktemp "$RUNNER_TEMP/signed-device-result.XXXXXX")
          (
            set +e
            build_started_epoch=$(date +%s)
            prebuilt_archive="$IOS_BUILD_CACHE_ROOT/central-merge-signing/prewarmed/AIServerClient.app.zip"
            prebuilt_sha_file="$IOS_BUILD_CACHE_ROOT/central-merge-signing/prewarmed/source-sha"
            if [[ -f "$prebuilt_archive" ]] \
              && [[ -f "$prebuilt_sha_file" ]] \
              && [[ "$(cat "$prebuilt_sha_file")" == "${{ github.sha }}" ]] \
              && git diff --quiet "${{ github.sha }}" HEAD -- .; then
              cp "$prebuilt_archive" "$RUNNER_TEMP/AIServerClient.app.zip"
              echo "Reusing signed device app prepared for unchanged tree ${{ github.sha }}." > "$build_log"
              build_status=0
              build_duration_seconds='${{ steps.central_prepare.outputs.device_build_warm_duration_seconds }}'
            else
              xcodebuild build \
              -project AIServerClient.xcodeproj \
              -scheme AIServerClient \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$IOS_BUILD_CACHE_ROOT/central-merge-signing" \
              -clonedSourcePackagesDirPath "$IOS_BUILD_CACHE_ROOT/source-packages" \
              -allowProvisioningUpdates \
              -allowProvisioningDeviceRegistration \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              COMPILER_INDEX_STORE_ENABLE=NO > "$build_log" 2>&1
              build_status=$?
              if ((build_status == 0)); then
                app_path="$IOS_BUILD_CACHE_ROOT/central-merge-signing/Build/Products/Debug-iphoneos/AIServerClient.app"
                test -d "$app_path" \
                  && codesign --verify --deep --strict --verbose=2 "$app_path" \
                  && ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/AIServerClient.app.zip"
                build_status=$?
              fi
            fi
            build_duration_seconds=${build_duration_seconds:-$(($(date +%s) - build_started_epoch))}
            printf '%s %s\n' "$build_status" "$build_duration_seconds" > "$build_result"
            exit "$build_status"
          ) &
          build_pid=$!

          set +e
          test_status=0
          if [[ "$test_scope" == build ]]; then
            echo "Low-risk App change; signed build verification replaces shared simulator tests."
          else
            ./ci/run-timed-step.sh "$test_label" \
              ./ci/with-ios-simulator-lock.sh \
                --label "central merge tests $GITHUB_RUN_ID" \
                --wait-seconds 1200 \
                -- xcodebuild "$test_action" \
                -project AIServerClient.xcodeproj \
                -scheme AIServerClient \
                -destination 'platform=iOS Simulator,name=iPhone 16e' \
                -collect-test-diagnostics never \
                -derivedDataPath "$IOS_BUILD_CACHE_ROOT/central-merge-simulator" \
                -clonedSourcePackagesDirPath "$IOS_BUILD_CACHE_ROOT/source-packages" \
                ${test_arguments[@]+"${test_arguments[@]}"} \
                CODE_SIGNING_ALLOWED=NO \
                COMPILER_INDEX_STORE_ENABLE=NO
            test_status=$?
          fi
          wait "$build_pid"
          wait_status=$?
          set -e

          cat "$build_log"
          read -r build_status build_duration_seconds < "$build_result"
          echo "device_build_duration_seconds=$build_duration_seconds" >> "$GITHUB_OUTPUT"
          echo "Signed device build completed in ${build_duration_seconds}s (exit $build_status)."
          if ((test_status != 0)); then
            exit "$test_status"
          fi
          if ((wait_status != 0 || build_status != 0)); then
            exit "${build_status:-$wait_status}"
          fi

      - name: Report merge verification completed
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.06 publishing

      - name: Publish merged main
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          set -euo pipefail
          git config http.version HTTP/1.1
          ./ci/git-fetch-origin.sh --no-tags origin main

      - name: Record merge and verification duration
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          now_epoch=$(date +%s)
          echo "IOS_MERGE_SECONDS=$((now_epoch - IOS_MERGE_STARTED_EPOCH))" >> "$GITHUB_ENV"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^1)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to publish main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Delete merged task branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git push \
            --force-with-lease="refs/heads/$SOURCE_BRANCH:$SOURCE_SHA" \
            origin ":refs/heads/$SOURCE_BRANCH"

      - name: Install directly from selected central Mac
        id: local_install
        if: steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true' && steps.central_prepare.outputs.device_gate_failed != 'true'
        continue-on-error: true
        env:
          APP_ARCHIVE: ${{ runner.temp }}/AIServerClient.app.zip
          APP_PATH: ${{ runner.temp }}/signed-app/AIServerClient.app
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID }}
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_SIGNING_DERIVED_DATA_PATH: ${{ runner.tool_cache }}/ai-server-ios/central-merge-signing
        run: ./ci/run-timed-step.sh "Sign and install on iPhone" ./ci/sign-and-install-ios.sh

      - name: Report local installation completed
        if: always() && steps.local_install.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: ${{ steps.ios_tests.outputs.device_build_duration_seconds }}
          IOS_INSTALL_SECONDS: ${{ steps.local_install.outputs.duration_seconds }}
          IOS_DEVICE_WAIT_DURATION_SECONDS: ${{ steps.local_install.outputs.device_wait_seconds }}
          IOS_DIRECT_INSTALL_SECONDS: ${{ steps.local_install.outputs.direct_install_seconds }}
          IOS_XCODE_RECOVERY_SECONDS: ${{ steps.local_install.outputs.xcode_recovery_seconds }}
          IOS_FINAL_INSTALL_SECONDS: ${{ steps.local_install.outputs.final_install_seconds }}
          IOS_DEVICE_ID: ${{ steps.local_install.outputs.device_id }}
          IOS_DEVICE_NAME: ${{ steps.local_install.outputs.device_name }}
          IOS_DELIVERY_MODE: central-direct
        run: ./ci/report-ios-deployment.sh succeeded 1 installed-locally

      - name: Report configuration-only delivery completed
        if: always() && steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'false' && !failure()
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: 0
          IOS_INSTALL_SECONDS: 0
        run: ./ci/report-ios-deployment.sh succeeded 1 published-no-app-change

      - name: Schedule a fresh installation retry on office Mac mini
        if: always() && steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true' && (steps.central_prepare.outputs.device_gate_failed == 'true' || steps.local_install.outcome == 'failure') && (vars.IOS_CENTRAL_RUNNER_LABEL || 'office-builder') == 'office-builder'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 \
            --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/self-hosted-ios.yml/dispatches" \
            --data '{"ref":"main","inputs":{"git_ref":"main"}}'

      - name: Report published App awaiting installation
        if: always() && steps.merge.outputs.already_merged == 'false' && steps.merge.outputs.app_changed == 'true' && (steps.central_prepare.outputs.device_gate_failed == 'true' || steps.local_install.outcome == 'failure') && !failure()
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
          IOS_BUILD_SECONDS: ${{ steps.ios_tests.outputs.device_build_duration_seconds }}
          IOS_INSTALL_SECONDS: ${{ steps.local_install.outputs.duration_seconds }}
          IOS_DEVICE_WAIT_DURATION_SECONDS: ${{ steps.local_install.outputs.device_wait_seconds }}
          IOS_DIRECT_INSTALL_SECONDS: ${{ steps.local_install.outputs.direct_install_seconds }}
          IOS_XCODE_RECOVERY_SECONDS: ${{ steps.local_install.outputs.xcode_recovery_seconds }}
          IOS_FINAL_INSTALL_SECONDS: ${{ steps.local_install.outputs.final_install_seconds }}
        run: ./ci/report-ios-deployment.sh succeeded 1 published-pending-install

      - name: Report merge failure
        if: ${{ failure() && steps.local_install.outcome != 'failure' }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 merge-failed

      - name: Clean up Git credentials
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/ai-server-ios-git-token" \
            "$RUNNER_TEMP/ai-server-ios-git-askpass.sh"
