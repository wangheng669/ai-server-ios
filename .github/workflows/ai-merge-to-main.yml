name: AI merge task branch into main

on:
  push:
    branches:
      - "codex/**"

run-name: Merge ${{ github.ref_name }} into latest main

permissions:
  actions: write
  contents: write

jobs:
  merge:
    name: Safely integrate on office Mac mini
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - office-builder
    timeout-minutes: 45

    steps:
      - name: Check out task commit with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN }}

      - name: Report merge started
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.02 merging

      - name: Merge task into latest main
        id: merge
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "AI Merge Bot"
          git config user.email "actions@users.noreply.github.com"
          git config http.version HTTP/1.1
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags origin main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to fetch main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          git switch --force-create ai-merge origin/main

          if git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

          if git merge --no-ff --no-commit "$SOURCE_SHA"; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            test -n "$(git diff --name-only --diff-filter=U)"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve merge conflicts with local Codex
        if: steps.merge.outputs.has_conflicts == 'true' && steps.merge.outputs.already_merged == 'false'
        env:
          HOME: /Users/wangheng
        run: |
          set -euo pipefail
          codex_bin="$(find "$HOME/.nvm/versions/node" -path '*/bin/codex' -type f 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$codex_bin" || ! -x "$codex_bin" ]]; then
            echo "Local Codex CLI is not installed for $USER." >&2
            exit 1
          fi
          auth_file="$HOME/.codex/auth.json"
          if [[ ! -f "$auth_file" ]]; then
            echo "Local Codex login was not found for $USER." >&2
            exit 1
          fi
          automation_home="$RUNNER_TEMP/codex-ai-merge-home"
          install -d -m 700 "$automation_home"
          install -m 600 "$auth_file" "$automation_home/auth.json"
          CODEX_HOME="$automation_home" "$codex_bin" login status

          CODEX_HOME="$automation_home" "$codex_bin" exec \
            --ephemeral \
            --ignore-user-config \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="high"' \
            --sandbox workspace-write \
            --cd "$GITHUB_WORKSPACE" \
            - <<'PROMPT'
            Resolve the Git merge conflicts currently present in this repository.

            Goal: preserve the intended behavior from both the latest origin/main
            and the task branch being merged.

            Requirements:
            - Read AGENTS.md and follow its safety and verification rules.
            - Inspect both sides and their commit history before deciding.
            - Resolve every conflict semantically; never choose ours/theirs wholesale.
            - Keep unrelated code unchanged and do not delete either feature merely to compile.
            - Do not commit, push, install, change GitHub settings, or access secrets.
            - Leave the working tree with no unmerged paths.
            - If the two intentions are genuinely incompatible, leave that conflict unresolved
              and explain why instead of guessing. The workflow will stop safely.
          PROMPT

      - name: Verify conflict resolution and create merge commit
        if: steps.merge.outputs.already_merged == 'false'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unmerged" ]]; then
            echo "AI could not safely resolve these files:" >&2
            echo "$unmerged" >&2
            exit 1
          fi
          git add -A
          git commit -m "Merge $SOURCE_BRANCH into main"

      - name: Run complete iOS test suite
        if: steps.merge.outputs.already_merged == 'false'
        env:
          DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: |
          ./ci/report-ios-deployment.sh running 0.04 merge-testing || true
          set -o pipefail
          xcodebuild test \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-AIMergeTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Report merge verification completed
        if: steps.merge.outputs.already_merged == 'false'
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh running 0.06 publishing

      - name: Publish merged main
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          set -euo pipefail
          git config http.version HTTP/1.1
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags origin main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to verify main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^1)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Unable to publish main after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Delete merged task branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$SOURCE_BRANCH"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git push \
            --force-with-lease="refs/heads/$SOURCE_BRANCH:$SOURCE_SHA" \
            origin ":refs/heads/$SOURCE_BRANCH"

      - name: Install the newly merged main
        if: steps.merge.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 \
            --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/self-hosted-ios.yml/dispatches" \
            --data '{"ref":"main","inputs":{"git_ref":"main"}}'

      - name: Report merge failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ./ci/report-ios-deployment.sh failed 0 merge-failed
