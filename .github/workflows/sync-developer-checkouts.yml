name: Sync Hackintosh to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-hackintosh-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macOS, X64, ios-hackintosh]
    timeout-minutes: 10
    steps:
      - name: Safely synchronize the primary checkout
        run: |
          /Users/wang/Desktop/ai-server-ios/ci/automatic-main-sync.sh \
            /Users/wang/Desktop/ai-server-ios
