name: Upload verified Focus build 14 to TestFlight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect or publish Focus 1.0.23 (14)
        type: choice
        options: [audit, upload, verify]
        default: audit
      archive_path:
        description: Verified archive in the local iOS release cache
        type: string
      archive_sha256:
        description: SHA-256 of the verified archive
        type: string

run-name: Focus 1.0.23 (14) TestFlight — ${{ inputs.operation }}

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, macOS, X64, ios-hackintosh]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      TESTED_COMMIT: 1bd0d504681a323165fd0c3da4e8faa56a392188
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 8
          persist-credentials: false

      - name: Confirm the signed archive identity
        if: inputs.operation == 'upload'
        shell: bash
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          git merge-base --is-ancestor "$TESTED_COMMIT" HEAD
          test "$(plutil -extract ProductBuildVersion raw -o - "$DEVELOPER_DIR/../version.plist")" = 17F113
          [[ "$ARCHIVE_PATH" =~ ^/Users/wang/\.cache/ai-server-ios/testflight-1\.0\.23-build14\.[A-Za-z0-9]+/VerifiedAIServerClient\.xcarchive\.zip$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -f "$ARCHIVE_PATH" && test ! -L "$ARCHIVE_PATH"
          release_dir="$(mktemp -d "$RUNNER_TEMP/focus-build14.XXXXXX")"
          printf 'FOCUS_RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"
          cp "$ARCHIVE_PATH" "$release_dir/archive.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$release_dir/archive.zip" | shasum -a 256 -c -
          ditto -x -k "$release_dir/archive.zip" "$release_dir"
          app="$release_dir/AIServerClient.xcarchive/Products/Applications/AIServerClient.app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -Fx 'TeamIdentifier=9M7P4VLHY3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = com.wangheng.aiserverclient
          for component in "$app" "$app"/PlugIns/*.appex; do
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$component/Info.plist")" = 1.0.23
            test "$(plutil -extract CFBundleVersion raw -o - "$component/Info.plist")" = 14
          done

      - name: Check account and publish to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/focus-build14-key.XXXXXX")"
          trap 'rm -f -- "$key_dir/AuthKey.p8"; rmdir "$key_dir"' EXIT
          export APP_STORE_CONNECT_KEY_PATH="$key_dir/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$APP_STORE_CONNECT_KEY_PATH"
          unset APP_STORE_CONNECT_PRIVATE_KEY_BASE64
          if [[ "$OPERATION" != upload ]]; then
            ruby ci/verify-focus-testflight-release.rb "$OPERATION"
            exit
          fi
          ruby ci/verify-focus-testflight-release.rb preflight
          options="$FOCUS_RELEASE_DIR/export-options.plist"
          cp ci/ExportOptions-TestFlight.plist "$options"
          plutil -replace manageAppVersionAndBuildNumber -bool NO "$options"
          plutil -insert testFlightInternalTestingOnly -bool YES "$options"
          xcodebuild -exportArchive \
            -archivePath "$FOCUS_RELEASE_DIR/AIServerClient.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$FOCUS_RELEASE_DIR/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ruby ci/verify-focus-testflight-release.rb verify

      - name: Remove staged archive
        if: always()
        shell: bash
        run: |
          if [[ -n "${FOCUS_RELEASE_DIR:-}" && "$FOCUS_RELEASE_DIR" == "$RUNNER_TEMP"/focus-build14.* ]]; then
            rm -rf -- "$FOCUS_RELEASE_DIR"
          fi
