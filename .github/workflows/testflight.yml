name: Upload iOS app to TestFlight
on:
  workflow_dispatch:
run-name: Stop only withdrawn 13F build 1.0.25 (9)
permissions:
  contents: read
  actions: read
jobs:
  withdraw:
    runs-on: [self-hosted, macOS, X64, ios-hackintosh]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e31f8ecb74764647f2d1f6dd74cb0797d33e310a
      - name: Verify original upload evidence
        uses: actions/github-script@v8
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:43842347780});
            if(r.conclusion!=='success'||r.display_title!=='Upload e31f8ecb74764647f2d1f6dd74cb0797d33e310a to TestFlight')throw new Error('Wrong upload evidence');
      - name: Stop only verified withdrawn build and read back
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key=$(mktemp "$RUNNER_TEMP/withdraw-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          export APP_STORE_CONNECT_KEY_PATH="$key"
          ruby -Ici -rtestflight-processing-notify - <<'RUBY'
          c = TestFlightProcessing::Client.new(key_path: ENV.fetch("APP_STORE_CONNECT_KEY_PATH"), key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"), issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"))
          id = "4781fb5b-5569-4be8-bfd2-9777be52143c"
          app = c.app_id(TestFlightProcessing::BUNDLE_ID)
          response = c.builds(app)
          b = response.fetch("data").find { |x| x.fetch("id") == id } or raise "Target build not in expected app"
          attrs = b.fetch("attributes")
          preid = b.fetch("relationships").fetch("preReleaseVersion").fetch("data").fetch("id")
          pre = response.fetch("included").find { |x| x.fetch("id") == preid } or raise "No prerelease version"
          raise "Wrong version/build" unless attrs.fetch("version") == "9" && pre.fetch("attributes").fetch("version") == "1.0.25"
          uploaded = Time.parse(attrs.fetch("uploadedDate"))
          raise "Wrong upload window" unless uploaded >= Time.utc(2026,11,16,9,49) && uploaded < Time.utc(2026,11,16,9,55)
          puts "Verified exact newly uploaded build #{id}: 1.0.25 (9), #{uploaded.utc.iso8601}"
          c.expire_build(id) unless attrs.fetch("expired")
          result = c.get("/v1/builds/#{id}").fetch("data")
          raise "Expiration not confirmed" unless result.fetch("id") == id && result.fetch("attributes").fetch("expired") == true
          puts "CONFIRMED expired=true for only #{id}; all other builds untouched."
          RUBY
