name: Upload iOS app to TestFlight

on:
  schedule:
    # GitHub cron uses UTC. 20:30 UTC is 04:30 the next day in Asia/Shanghai.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to upload
        required: false
        default: main
        type: string

run-name: Upload ${{ inputs.git_ref || 'main' }} to TestFlight

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Check for a new main revision
    runs-on: ubuntu-slim
    outputs:
      should_upload: ${{ steps.decision.outputs.should_upload }}
    steps:
      - name: Decide whether an upload is needed
        id: decision
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("should_upload", "true");
              return;
            }

            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "testflight.yml",
            });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.data.id,
              branch: context.ref.replace("refs/heads/", ""),
              status: "success",
              per_page: 10,
            });
            const previousUpload = runs.data.workflow_runs.find(
              (run) => run.id !== context.runId
            );
            const shouldUpload = previousUpload?.head_sha !== context.sha;
            core.info(
              shouldUpload
                ? `Uploading new revision ${context.sha}.`
                : `Skipping ${context.sha}; it was already uploaded successfully.`
            );
            core.setOutput("should_upload", String(shouldUpload));

  upload:
    name: Test, archive, and upload
    needs: check
    if: needs.check.outputs.should_upload == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out requested version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || 'main' }}

      - name: Prepare App Store Connect authentication
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r '
                [.devices[][] | select(.isAvailable and .name == "iPhone 16e")][0].udid //
                [.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid //
                empty
              '
          )"
          test -n "$simulator_udid"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-TestFlightTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App Store archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AIServerClient.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=9M7P4VLHY3 \
            CODE_SIGN_STYLE=Automatic

      - name: Upload archive to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AIServerClient.xcarchive" \
            -exportOptionsPlist ci/ExportOptions-TestFlight.plist \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove authentication key
        if: ${{ always() }}
        run: rm -f "$APP_STORE_CONNECT_KEY_PATH"
