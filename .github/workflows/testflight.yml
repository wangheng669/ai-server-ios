name: Upload iOS app to TestFlight

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to upload
        required: false
        default: main
        type: string
      only_if_new:
        description: Skip when this revision was already uploaded successfully
        required: false
        default: false
        type: boolean

run-name: Upload ${{ inputs.git_ref || 'main' }} to TestFlight

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Check for a new main revision
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - office-builder
    outputs:
      should_upload: ${{ steps.decision.outputs.should_upload }}
    steps:
      - name: Decide whether an upload is needed
        id: decision
        uses: actions/github-script@v8
        env:
          ONLY_IF_NEW: ${{ inputs.only_if_new }}
        with:
          script: |
            if (process.env.ONLY_IF_NEW !== "true") {
              core.setOutput("should_upload", "true");
              return;
            }

            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "testflight.yml",
            });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.data.id,
              branch: context.ref.replace("refs/heads/", ""),
              status: "success",
              per_page: 10,
            });
            const previousUpload = runs.data.workflow_runs.find(
              (run) => run.id !== context.runId
            );
            const shouldUpload = previousUpload?.head_sha !== context.sha;
            core.info(
              shouldUpload
                ? `Uploading new revision ${context.sha}.`
                : `Skipping ${context.sha}; it was already uploaded successfully.`
            );
            core.setOutput("should_upload", String(shouldUpload));

  upload:
    name: Test, archive, and upload
    needs: check
    if: needs.check.outputs.should_upload == 'true'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - office-builder
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
      EXPECTED_XCODE_BUILD: 27A5228h

    steps:
      - name: Check out requested version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || 'main' }}

      - name: Verify supported Xcode
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          actual_build="$(
            plutil -extract ProductBuildVersion raw -o - \
              "$DEVELOPER_DIR/../version.plist"
          )"
          if [[ "$actual_build" != "$EXPECTED_XCODE_BUILD" ]]; then
            echo "Expected Xcode build $EXPECTED_XCODE_BUILD, found $actual_build."
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare App Store Connect authentication
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Prepare next TestFlight version
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          TESTFLIGHT_BASE_MARKETING_VERSION="$(
            plutil -extract CFBundleShortVersionString raw -o - Config/Info.plist
          )"
          export TESTFLIGHT_BASE_MARKETING_VERSION
          ruby ci/testflight-processing-notify.rb \
            prepare "$RUNNER_TEMP/TestFlightBuildsBeforeUpload.json"

      - name: Apply TestFlight version
        run: |
          set -euo pipefail
          plutil -replace CFBundleShortVersionString \
            -string "$TESTFLIGHT_MARKETING_VERSION" \
            Config/Info.plist
          echo "Building TestFlight version $TESTFLIGHT_MARKETING_VERSION."

      - name: Run tests
        run: |
          set -o pipefail
          ./ci/with-ios-simulator-lock.sh \
            --label "TestFlight tests $GITHUB_RUN_ID" \
            -- xcodebuild test \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath "$RUNNER_TEMP/AIServerClient-TestFlightTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App Store archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AIServerClient.xcodeproj \
            -scheme AIServerClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AIServerClient.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=9M7P4VLHY3 \
            CODE_SIGN_STYLE=Automatic

      - name: Upload archive to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AIServerClient.xcarchive" \
            -exportOptionsPlist ci/ExportOptions-TestFlight.plist \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Wait for App Store Connect processing and notify DingTalk
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEPLOYMENT_STATUS_API_KEY: ${{ secrets.IOS_DEPLOYMENT_STATUS_API_KEY }}
        run: ruby ci/testflight-processing-notify.rb wait "$RUNNER_TEMP/TestFlightBuildsBeforeUpload.json"

      - name: Remove authentication key
        if: ${{ always() }}
        run: rm -f "$APP_STORE_CONNECT_KEY_PATH"
