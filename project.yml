name: AIServerClient
options:
  bundleIdPrefix: com.wangheng
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  AIServerClient:
    type: application
    platform: iOS
    sources:
      - AIClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangheng.aiserverclient
        DEVELOPMENT_TEAM: 9M7P4VLHY3
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AIClientTests
  AIClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AIClientTests
    dependencies:
      - target: AIServerClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangheng.aiserverclient.tests
        DEVELOPMENT_TEAM: 9M7P4VLHY3
        GENERATE_INFOPLIST_FILE: YES
